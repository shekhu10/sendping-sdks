[package]
name = "sendping"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Official Rust SDK for the SendPing email API — send transactional and marketing email from your own verified domain."
homepage = "https://www.sendping.co"
documentation = "https://www.sendping.co/docs"
repository = "https://github.com/shekhu10/sendping-sdks"
keywords = ["email", "sendping", "sdk", "api", "transactional"]
categories = ["api-bindings", "email", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
